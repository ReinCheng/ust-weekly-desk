name: Publish UST Weekly Desk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public macro & auction data before publishing
        type: boolean
        default: true
      near:
        description: Fast near-term refresh only (current +/-1 week, ~40s)
        type: boolean
        default: true
      run_alpha:
        description: Also re-run Core3 Python paper trading & briefing engine
        type: boolean
        default: false
  schedule:
    # Pure UTC release-window crons (reliable on GitHub Actions; covers both EDT -4 & EST -5)
    - cron: '34,48 12,13 * * 1-5'   # 08:34/08:48 ET: CPI/PCE/NFP/GDP/Claims/Retail/Durable
    - cron: '4,16 14,15 * * 1-5'    # 10:04/10:16 ET: JOLTS/New Home Sales/4W+8W Bills
    - cron: '34 15,16 * * 1-5'      # 11:34 ET: 17W Bill & early-close Coupon Auctions
    - cron: '4,16 17,18 * * 1-5'    # 13:04/13:16 ET: Standard 2Y-30Y/TIPS Auctions
    - cron: '6,36 18,19 * * 1-5'    # 14:06/14:36 ET: FOMC/Minutes/Beige Book
    - cron: '25 21,22,23 * * 1-5'   # 17:25/18:25 ET: Official Treasury EOD Curve + Core3 Engine
    - cron: '25 10,11 * * *'        # 06:25 ET: Global Markets + Core3 Pre-Open Check
    - cron: '7 23 * * 0'            # Sun 18:07/19:07 ET: Full 8-Week Calendar Refresh

concurrency:
  group: ust-weekly-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.cache.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Refresh official data
        if: (github.event_name == 'schedule' && github.event.schedule != '25 10,11 * * *') || inputs.refresh
        env:
          FULL_REFRESH: ${{ github.event.schedule == '7 23 * * 0' || (github.event_name == 'workflow_dispatch' && !inputs.near) }}
        run: |
          if [[ "$FULL_REFRESH" == "true" ]]; then
            pnpm run refresh
          else
            pnpm run refresh --near
          fi
      - name: Refresh global market history
        if: github.event.schedule == '25 10,11 * * *' || (github.event_name == 'workflow_dispatch' && !inputs.near)
        run: pnpm run refresh:markets
      - name: Setup Python for Core3 Alpha Paper Engine
        if: github.event.schedule == '25 21,22,23 * * 1-5' || github.event.schedule == '25 10,11 * * *' || inputs.run_alpha
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'alpha/requirements.txt'
      - name: Run Python Core3 Paper Trading & Auto-Verification
        if: github.event.schedule == '25 21,22,23 * * 1-5' || github.event.schedule == '25 10,11 * * *' || inputs.run_alpha
        run: |
          pip install -r alpha/requirements.txt
          python alpha/update_paper.py
      - name: Check whether to publish
        id: cache
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && git diff --quiet -- calendar.json replays.json market-history.json alpha-paper.json alpha-ledger.json alpha-briefings.json; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test research calculations and data
        if: steps.cache.outputs.publish == 'true'
        run: pnpm test
      - name: Build website
        if: steps.cache.outputs.publish == 'true'
        run: pnpm run build
      - name: Save new public data
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          if git diff --quiet -- calendar.json replays.json market-history.json alpha-paper.json alpha-ledger.json alpha-briefings.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- calendar.json replays.json market-history.json alpha-paper.json alpha-ledger.json alpha-briefings.json
          git commit -m "Refresh public market, macro, and Core3 paper ledger data"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        if: steps.cache.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
