name: Publish UST Weekly Desk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public data before publishing
        type: boolean
        default: true
  schedule:
    - cron: '7,22,37,52 8-16 * * 1-5'
      timezone: America/New_York
    - cron: '25 17,18 * * 1-5'
      timezone: America/New_York
    - cron: '7 18 * * 0'
      timezone: America/New_York
    - cron: '25 6 * * *'
      timezone: America/New_York

concurrency:
  group: ust-weekly-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.cache.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Refresh official data
        if: (github.event_name == 'schedule' && github.event.schedule != '25 6 * * *') || inputs.refresh
        env:
          WEEKLY: ${{ github.event.schedule == '7 18 * * 0' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$WEEKLY" != "true" ]]; then
            pnpm run refresh --near
          else
            pnpm run refresh
          fi
      - name: Refresh global market history
        if: github.event.schedule == '25 6 * * *' || inputs.refresh
        run: pnpm run refresh:markets
      - name: Setup Python for Core3 Alpha Paper Engine
        if: github.event.schedule == '25 17,18 * * 1-5' || github.event.schedule == '25 6 * * *' || inputs.refresh
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'alpha/requirements.txt'
      - name: Run Python Core3 Paper Trading & Auto-Verification
        if: github.event.schedule == '25 17,18 * * 1-5' || github.event.schedule == '25 6 * * *' || inputs.refresh
        run: |
          pip install -r alpha/requirements.txt
          python alpha/update_paper.py
      - name: Check whether to publish
        id: cache
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && git diff --quiet -- calendar.json replays.json market-history.json alpha-paper.json alpha-ledger.json alpha-briefings.json; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test research calculations and data
        if: steps.cache.outputs.publish == 'true'
        run: pnpm test
      - name: Build website
        if: steps.cache.outputs.publish == 'true'
        run: pnpm run build
      - name: Save new public data
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          if git diff --quiet -- calendar.json replays.json market-history.json alpha-paper.json alpha-ledger.json alpha-briefings.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- calendar.json replays.json market-history.json alpha-paper.json alpha-ledger.json alpha-briefings.json
          git commit -m "Refresh public market, macro, and Core3 paper ledger data"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        if: steps.cache.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
