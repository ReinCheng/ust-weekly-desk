name: Publish UST Weekly Desk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public data before publishing
        type: boolean
        default: true
  schedule:
    - cron: '0 18 * * 0'
      timezone: America/New_York

concurrency:
  group: ust-weekly-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Refresh official calendars
        if: github.event_name == 'schedule' || inputs.refresh
        run: pnpm run refresh
      - name: Build website
        run: pnpm run build
      - name: Save the public calendar cache
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          if git diff --quiet -- calendar.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- calendar.json
          git commit -m "Refresh public Treasury calendar"
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
